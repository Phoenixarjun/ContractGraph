name: evals

# The eval suite is deterministic and offline: no network, no model calls, no
# API keys. It should pass on a clean checkout with nothing but Python.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The contract: a clean checkout with nothing installed must be green.
  # Cases needing an optional extra report SKIP with a reason; the
  # evals-with-extras job below covers those paths.
  evals:
    name: run_evals (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Assert no optional extra is installed
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("pypdf", "toon") if importlib.util.find_spec(m)]
          if present:
              sys.exit(f"Optional extras unexpectedly present: {present}. "
                       "This job must prove the stdlib-only path.")
          print("OK: stdlib-only environment.")
          PY

      - name: Run the eval suite (stdlib only)
        run: python evals/run_evals.py

  # Covers the paths the stdlib-only matrix necessarily skips: PDF extraction
  # (pypdf) and TOON encoding (toon).
  evals-with-extras:
    name: run_evals (optional extras installed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional extras
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Run the eval suite (extras installed)
        run: python evals/run_evals.py

  validators:
    name: public bundle validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the public contract bundle
        run: python scripts/validate_contract_bundle.py contracts/study-plan

      - name: Validate the public synthetic context
        run: python scripts/validate_context.py context/synthetic/study-plan

      - name: Validate the compiled graph
        run: python scripts/validate_compiled_graph.py runtime/compiled/study-plan/graph.json

  hygiene:
    name: no private data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no ignored path is tracked
        run: |
          tracked_and_ignored=$(git ls-files -i -c --exclude-standard)
          if [ -n "$tracked_and_ignored" ]; then
            echo "Tracked files match .gitignore rules:"
            echo "$tracked_and_ignored"
            exit 1
          fi
          echo "OK: nothing tracked is ignored."

      - name: Assert no private context or run output is tracked
        run: |
          leaked=$(git ls-files \
            'context/canonical/*' \
            'context/derived/*' \
            'runtime/runs/*' \
            'contracts/*-private/*' \
            | grep -v 'README.md' || true)
          if [ -n "$leaked" ]; then
            echo "Private paths are tracked:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: no private path is tracked."
