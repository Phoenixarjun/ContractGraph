blank_issues_enabled: false
contact_links:
  - name: Security or privacy report
    url: https://github.com/Phoenixarjun/ContractGraph/security/advisories/new
    about: >
      Private context leaking into a publishable artifact, a .gitignore gap,
      path traversal, or arbitrary code execution. Report privately — never in
      a public issue. See SECURITY.md.
  - name: Question or idea
    url: https://github.com/Phoenixarjun/ContractGraph/discussions
    about: >
      Usage questions and open-ended ideas. Open a feature proposal once the
      idea is concrete.
  - name: Documentation
    url: https://github.com/Phoenixarjun/ContractGraph/tree/main/docs
    about: >
      Architecture, contract model, execution, validation, and privacy are all
      documented here before you file.
