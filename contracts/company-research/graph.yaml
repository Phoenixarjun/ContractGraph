version: "1.0.0"
bundle: contract.bundle.json
generated: true
sourceOfTruth: node-contracts
runtime: claude-code

layers:
  - id: foundation
    parallel:
      - company-intelligence
      - role-intelligence

  - id: company-and-process
    parallel:
      - company-initiatives
      - interview-process
      - compensation-location

  - id: preparation-and-alignment
    parallel:
      - dsa
      - cs-fundamentals
      - domain-knowledge
      - hld
      - lld
      - behavioral
      - profile-alignment

  - id: candidate-evidence
    parallel:
      - project-deep-dive
      - networking-referral

  - id: resume-map
    map:
      node: resume-analysis
      over: configuredRoles

  - id: strategy
    parallel:
      - application-strategy
      - resources

  - id: completion
    sequence:
      - deterministic-merge
      - main-schema-validation
      - global-verification

